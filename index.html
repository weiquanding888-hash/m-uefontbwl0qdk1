<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="muse">
<meta name="theme-color" content="#0B0D11">
<link rel="apple-touch-icon" href="icon.png">
<title>muse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* 单栏手机看板：深灰近黑底、青绿主色（与 muse App 同一套），卡片自上而下，摘要在前、细节可折叠 */
:root {
  --bg: #0B0D11;
  --card: #161A21;
  --well: #0F1217;
  --line: rgba(255,255,255,0.06);
  --line-strong: rgba(255,255,255,0.12);
  --fg: #F2F5F3;
  --fg-2: #9AA5A0;
  --fg-3: #8B958F;
  --teal: #35C48D;
  --teal-2: #63F0BD;
  --gold: #D9A94E;
  --bond: #7D8AA5;
  --cash: #5B6470;
  --bench: #8A929C;
  --warn: #E5C05B;
  --pill: #2A313B;
  --font: -apple-system, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
  --num: Inter, -apple-system, "PingFang SC", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  color: var(--fg);
  font-family: var(--font);
  font-size: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 32px;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
button { font-family: inherit; color: inherit; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--teal-2); outline-offset: 2px; }

header { display: flex; align-items: center; gap: 10px; }
.brand { display: flex; flex-direction: column; gap: 1px; flex: 1; min-width: 0; }
.brand b { font-size: 19px; font-weight: 700; letter-spacing: 0.01em; }
.brand span { font-size: 12px; color: var(--fg-3); }
.icon-btn { width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--line-strong); background: var(--card); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
.icon-btn svg { transition: transform .6s ease; }
.icon-btn.spin svg { transform: rotate(360deg); }

.status { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--fg-2); min-height: 16px; }
.dot { width: 7px; height: 7px; border-radius: 4px; background: var(--teal); flex: none; }
.dot.warn { background: var(--warn); }

.seg { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 4px; padding: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
.seg button { height: 40px; border: 0; border-radius: 9px; background: transparent; color: var(--fg-2); font-size: 15px; font-weight: 500; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); font-weight: 600; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.card.fold { padding: 0; gap: 0; overflow: hidden; }
.row { display: flex; align-items: center; gap: 8px; }
.chip { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.chip.champion { background: var(--teal); color: var(--bg); }
.chip.observer, .chip.warn { color: var(--warn); border: 1px solid rgba(229,192,91,0.45); padding: 2px 8px; }
.muted { color: var(--fg-3); font-size: 12px; }
.sub { color: var(--fg-2); font-size: 13px; }
.hero { font-size: 56px; line-height: 1; font-weight: 700; color: var(--teal); }
.hero small { font-size: 28px; font-weight: 600; }
.pos { color: var(--teal-2); }
.well { background: var(--well); border-radius: 12px; padding: 12px 14px; }
.day { display: flex; align-items: center; gap: 12px; }
.day > div { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
.day .v { display: flex; align-items: center; gap: 6px; font-size: 22px; font-weight: 600; }
.vr { width: 1px; align-self: stretch; background: rgba(255,255,255,0.08); }
.pair { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
.pair > div { display: flex; justify-content: space-between; align-items: baseline; padding: 0 2px; }
.pair b { font-size: 15px; font-weight: 600; }

h2 { margin: 0; font-size: 16px; font-weight: 600; }
.head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.bar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; gap: 2px; }
.legs { display: flex; flex-direction: column; gap: 10px; }
.leg { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.leg i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.leg span { flex: 1; }
.leg b { font-weight: 600; }
.inner { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
.inner div { display: flex; flex-direction: column; gap: 2px; }
.inner b { font-size: 18px; font-weight: 600; }
.cells { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 1px; background: var(--line); border-radius: 12px; overflow: hidden; }
.cells > div { background: var(--well); padding: 10px 12px; display: flex; flex-direction: column; gap: 3px; }
.cells b { font-size: 15px; font-weight: 600; }
.alert { display: flex; align-items: center; gap: 10px; background: rgba(229,192,91,0.08); border-radius: 10px; padding: 10px 12px; font-size: 13px; }

.fold-btn { width: 100%; min-height: 56px; padding: 0 18px; background: transparent; border: 0; display: flex; align-items: center; gap: 10px; cursor: pointer; text-align: left; }
.fold-btn .sum { font-size: 12px; color: var(--fg-3); flex: 1; min-width: 0; text-align: right; }
.fold-btn svg { flex: none; transition: transform .2s ease; }
.fold-btn[aria-expanded="true"] svg { transform: rotate(180deg); }
.fold-body { padding: 0 18px 18px; display: flex; flex-direction: column; gap: 12px; }

.ranges { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 4px; padding: 3px; background: var(--well); border-radius: 10px; }
.ranges button { height: 36px; border: 0; border-radius: 8px; background: transparent; color: var(--fg-3); font-size: 13px; font-weight: 600; cursor: pointer; }
.ranges button[aria-pressed="true"] { background: var(--pill); color: var(--fg); }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--fg-2); flex-wrap: wrap; }
.legend span { display: flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 3px; border-radius: 2px; }
.legend i.dash { height: 0; border-top: 1.5px dashed var(--warn); }
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; touch-action: pan-y; cursor: crosshair; }
.tip { position: absolute; top: 0; width: 150px; background: rgba(23,27,34,0.96); border: 1px solid var(--line-strong); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; pointer-events: none; box-shadow: 0 6px 20px rgba(0,0,0,0.45); }
.tip .r { display: flex; justify-content: space-between; font-size: 12px; }
.tip .r span { display: flex; align-items: center; gap: 5px; color: var(--fg-2); }
.tip .r i { width: 8px; height: 8px; border-radius: 4px; }
.tip .d { border-top: 1px solid rgba(255,255,255,0.08); padding-top: 4px; }
.note { font-size: 12px; color: var(--fg-3); line-height: 1.55; }
.prog { height: 6px; border-radius: 3px; background: var(--well); overflow: hidden; }
.prog i { display: block; height: 6px; background: var(--teal); }
.between { display: flex; justify-content: space-between; font-size: 12px; color: var(--fg-3); }

footer { font-size: 11px; color: var(--fg-3); line-height: 1.6; text-align: center; padding-top: 4px; }
.empty { padding: 48px 18px; text-align: center; color: var(--fg-2); display: flex; flex-direction: column; gap: 8px; align-items: center; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--pill); color: var(--fg); font-size: 13px; padding: 8px 14px; border-radius: 999px; box-shadow: 0 6px 20px rgba(0,0,0,0.4); }
@media (prefers-reduced-motion: reduce) { .icon-btn svg, .fold-btn svg { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
      <circle cx="17" cy="17.7" r="10.2" fill="none" stroke="#35C48D" stroke-width="1.9"></circle>
      <polyline points="5.4,22.4 10.9,19.7 15,21.8 19.4,15.6 22.8,17.3 28.9,10.9" fill="none" stroke="#F2F5F3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></polyline>
    </svg>
    <div class="brand"><b>muse</b><span>A股 · 加密 一台看全</span></div>
    <button class="icon-btn" id="refresh" type="button" aria-label="刷新数据">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"></path><polyline points="21 3 21 9 15 9"></polyline></svg>
    </button>
  </header>
  <div class="status"><span class="dot warn" id="dot"></span><span class="num" id="status">正在读取云端数据…</span></div>
  <div class="seg" role="group" aria-label="市场">
    <button type="button" id="tab-ashare" aria-pressed="true">A股</button>
    <button type="button" id="tab-crypto" aria-pressed="false">加密</button>
  </div>
  <main id="main">
    <div class="card empty">
      <b>正在读取云端数据</b>
      <span class="muted">两个模型的仓位、收益和走势会显示在这里。云端引擎每天东京时间 18:30 计算一次。</span>
    </div>
  </main>
  <footer id="foot">只出数，不给实盘仓位建议<br>云端引擎每天东京时间 18:30 计算</footer>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function () {
  "use strict";
  var DOC = null, MARKET = "ashare", RANGE = "all", OPEN = { chart: false, fwd: false }, DBREF = null;
  try { MARKET = localStorage.getItem("muse.market") || "ashare"; RANGE = localStorage.getItem("muse.range") || "all"; } catch (e) {}
  if (MARKET !== "ashare" && MARKET !== "crypto") MARKET = "ashare";

  var $ = function (id) { return document.getElementById(id); };
  var TONE = { hold: "var(--teal)", gold: "var(--gold)", bond: "var(--bond)", cash: "var(--cash)", wait: "var(--warn)" };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
  var sgn = function (v, d) { var a = Math.abs(v); var t = a >= 1000 ? String(Math.round(a)) : a.toFixed(d == null ? 1 : d); return (v >= 0 ? "+" : "−") + t; };
  var pct = function (v, d) { return sgn(v, d) + "%"; };
  var pc0 = function (w) { return Math.round(w * 100) + "%"; };
  var pc2 = function (w) { return (w * 100).toFixed(2) + "%"; };
  var md = function (d) { return d ? d.slice(5) : ""; };
  function toast(msg) { var t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(function () { t.hidden = true; }, 1800); }

  function daysOld(day) { if (!day) return 99; return Math.floor((Date.now() - Date.parse(day + "T00:00:00+09:00")) / 86400000); }
  function setStatus() {
    if (!DOC) return;
    var m = DOC[MARKET], dd = MARKET === "ashare" ? DOC.data_date_ashare : DOC.data_date_crypto;
    var g = DOC.generated_at || "";
    var when = g.slice(5, 10) + " " + g.slice(11, 16);
    var old = DOC.stale || daysOld(dd) > (MARKET === "ashare" ? 4 : 4);
    $("dot").className = "dot" + (old ? " warn" : "");
    $("status").textContent = (old ? "数据可能不是最新 · " : "云端数据 · ") + (MARKET === "ashare" ? "A股 " : "加密 ") + dd + " · 计算于 " + when;
  }

  function chartData(m, key) {
    var R = { "1y": 52, "3y": 156, "5y": 260, "10y": 520 };
    var S0 = m.series.s, B0 = m.series.b, D0 = m.series.dates, n = S0.length;
    var i0 = key === "all" ? 0 : Math.max(0, n - 1 - R[key]);
    var S = S0.slice(i0), B = B0.slice(i0), D = D0.slice(i0), k = S.length;
    var rs = S.map(function (v) { return (v / S[0] - 1) * 100; }), rb = B.map(function (v) { return (v / B[0] - 1) * 100; });
    var all = rs.concat(rb), mx = Math.max.apply(null, all), mn = Math.min.apply(null, all);
    var log = m.log_ok && (100 + mx) / (100 + mn) > 5;
    var f = log ? function (v) { return Math.log10(1 + v / 100); } : function (v) { return v; };
    var lo = f(mn), hi = f(mx), pad = (hi - lo) * 0.06 || 1; lo -= pad; hi += pad;
    var ffi = Math.max(0, (m.forward_from_index | 0) - i0);
    var hasFwd = ffi < k;
    var W = hasFwd ? 326 : 296, H = 150;
    var X = function (i) { return i / (k - 1) * W; }, Y = function (v) { return H - (f(v) - lo) / (hi - lo) * H; };
    var divX = hasFwd ? X(Math.max(0, ffi - 0.5)) : 296;
    var ticks = [];
    if (log) ticks = [-75, -50, 0, 100, 300, 1000, 3000, 10000, 30000];
    else {
      var raw = (mx - mn) / 4, steps = [1, 2, 2.5, 5, 10, 20, 25, 50, 100, 200, 250, 500, 1000], st = 1000;
      for (var s = 0; s < steps.length; s++) if (steps[s] >= raw) { st = steps[s]; break; }
      for (var v = Math.ceil(mn / st) * st; v <= mx + st; v += st) ticks.push(Math.round(v * 10) / 10);
    }
    ticks = ticks.filter(function (t) { var y = Y(t); return y > 2 && y < 148; });
    var yrs = (Date.parse(D[k - 1]) - Date.parse(D[0])) / 31557600000;
    var xt = [0, 0.36, 0.72].map(function (fr) { var i = Math.round(fr * (k - 1)); return { x: X(i), t: yrs > 2.5 ? D[i].slice(0, 4) : D[i].slice(0, 7) }; });
    var names = { "1y": "近1年", "3y": "近3年", "5y": "近5年", "10y": "近10年", "all": "全部" };
    return { k: k, rs: rs, rb: rb, D: D, X: X, Y: Y, W: W, H: H, divX: divX, log: log, ticks: ticks, xt: xt, name: names[key], fwdStart: m.forward.start };
  }

  function path(c, arr) { var p = ""; for (var i = 0; i < arr.length; i++) p += (i ? "L" : "M") + c.X(i).toFixed(1) + " " + c.Y(arr[i]).toFixed(1); return p; }
  function tickLabel(v) { if (Math.abs(v) < 1e-9) return "0%"; var a = Math.abs(v); return (v > 0 ? "+" : "−") + (a % 1 === 0 ? a : a.toFixed(1)) + "%"; }

  function chartSVG(c, m) {
    var sp = path(c, c.rs), bp = path(c, c.rb), endI = c.k - 1;
    var g = "";
    c.ticks.forEach(function (t) {
      var y = c.Y(t).toFixed(1), zero = Math.abs(t) < 1e-9;
      g += '<line x1="0" y1="' + y + '" x2="' + c.divX.toFixed(1) + '" y2="' + y + '" stroke="' + (zero ? "rgba(255,255,255,0.22)" : "rgba(255,255,255,0.06)") + '"' + (zero ? ' stroke-dasharray="3 4"' : "") + '></line>';
      g += '<text x="0" y="' + (y - 3) + '" fill="#8B958F" font-size="10" font-family="Inter, sans-serif">' + tickLabel(t) + "</text>";
    });
    var xt = c.xt.map(function (t, i) { return '<text x="' + t.x.toFixed(1) + '" y="166" fill="#8B958F" font-size="10" text-anchor="' + (i === 0 ? "start" : "middle") + '" font-family="Inter, sans-serif">' + t.t + "</text>"; }).join("");
    return '<svg id="chart-svg" viewBox="0 -14 326 192" role="img" aria-label="' + esc(c.name + "累计收益率：策略 " + pct(c.rs[endI]) + "，" + m.bench_name + " " + pct(c.rb[endI])) + '">' +
      '<rect x="' + c.divX.toFixed(1) + '" y="-14" width="' + (326 - c.divX).toFixed(1) + '" height="164" fill="rgba(229,192,91,0.07)"></rect>' + g +
      '<path d="' + sp + " L" + c.X(endI).toFixed(1) + " 150 L0 150 Z" + '" fill="rgba(53,196,141,0.10)"></path>' +
      '<path d="' + bp + '" fill="none" stroke="#8A929C" stroke-width="1.4" stroke-linejoin="round"></path>' +
      '<path d="' + sp + '" fill="none" stroke="#35C48D" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"></path>' +
      '<line x1="' + c.divX.toFixed(1) + '" y1="-14" x2="' + c.divX.toFixed(1) + '" y2="150" stroke="#E5C05B" stroke-width="1.5" stroke-dasharray="4 4"></line>' +
      '<circle cx="' + c.X(endI).toFixed(1) + '" cy="' + c.Y(c.rs[endI]).toFixed(1) + '" r="3.5" fill="#35C48D"></circle>' +
      '<text x="' + (c.divX - 6).toFixed(1) + '" y="-3" fill="#8B958F" font-size="10" text-anchor="end">回测</text>' +
      '<text x="' + (c.divX + 5).toFixed(1) + '" y="-3" fill="#E5C05B" font-size="10">前向</text>' +
      '<line x1="0" y1="150" x2="326" y2="150" stroke="rgba(255,255,255,0.10)"></line>' + xt +
      '<text x="326" y="166" fill="#E5C05B" font-size="10" text-anchor="end" font-family="Inter, sans-serif">' + md(c.fwdStart) + "</text>" +
      '<line id="hx" x1="0" y1="-14" x2="0" y2="150" stroke="#F2F5F3" stroke-opacity="0" stroke-width="1"></line>' +
      '<circle id="hb" cx="0" cy="0" r="0" fill="#0B0D11" stroke="#8A929C" stroke-width="2"></circle>' +
      '<circle id="hs" cx="0" cy="0" r="0" fill="#0B0D11" stroke="#35C48D" stroke-width="2"></circle>' +
      "</svg>";
  }

  function render() {
    if (!DOC) return;
    var m = DOC[MARKET];
    setStatus();
    $("tab-ashare").setAttribute("aria-pressed", String(MARKET === "ashare"));
    $("tab-crypto").setAttribute("aria-pressed", String(MARKET === "crypto"));
    var c = chartData(m, RANGE), endI = c.k - 1;
    var lead = m.ret_since_2024 - m.bench_since_2024;
    var dn = '<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M1 2.5 L9 2.5 L5 8.5 Z" fill="currentColor"></path></svg>';
    var up = '<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M1 7.5 L9 7.5 L5 1.5 Z" fill="currentColor"></path></svg>';
    var arrow = function (v) { return v >= 0 ? up : dn; };
    var fw = m.forward, fdays = fw.days | 0;
    var toStart = Math.ceil((Date.parse(fw.start + "T00:00:00+09:00") - Date.now()) / 86400000);
    var fchip = fdays > 0 ? "第 " + fdays + " 天" : (toStart > 0 ? toStart + " 天后开始" : "今天开始");
    var h = "";

    h += '<section class="card"><div class="row"><span class="chip ' + m.role_kind + '">' + esc(m.role_label) + '</span><span style="font-size:14px;font-weight:500">' + esc(m.name) + '</span><span class="muted" style="margin-left:auto">' + esc(m.legs_text) + "</span></div>";
    h += '<div style="display:flex;flex-direction:column;gap:4px"><div class="sub">2024 年以来累计收益</div><div class="hero num">' + sgn(m.ret_since_2024) + "<small>%</small></div>";
    h += '<div class="sub">' + esc(m.bench_name) + ' 同期 <span class="num" style="color:var(--fg)">' + pct(m.bench_since_2024) + "</span> · " + (lead >= 0 ? '多出 <span class="num pos">' + lead.toFixed(1) + "</span> 个点" : "收益让出，换回撤小得多") + "</div></div>";
    if (m.day) {
      h += '<div class="well day"><div><span class="muted num">当日涨跌 · ' + md(m.day.date) + '</span><span class="v num">' + arrow(m.day.strat) + pct(m.day.strat, 2) + "</span></div><span class=\"vr\"></span>";
      h += '<div><span class="muted">' + esc(m.bench_short) + ' 当日</span><span class="v num" style="color:var(--fg-2)">' + arrow(m.day.bench) + pct(m.day.bench, 2) + "</span></div></div>";
    }
    h += '<div class="pair"><div><span class="muted">最大回撤</span><b class="num">' + pct(m.maxdd) + '</b></div><div><span class="muted">' + esc(m.bench_name) + '</span><b class="num" style="color:var(--fg-2)">' + pct(m.bench_maxdd) + "</b></div></div></section>";

    h += '<section class="card"><div class="head"><h2>' + (m.role_kind === "champion" ? "当前目标配比" : "当前配比") + '</h2><span class="muted">' + esc(m.weights_caption) + "</span></div>";
    h += '<div class="bar">' + m.weights.map(function (w) { return '<span style="width:' + (w.weight * 100) + "%;background:" + (TONE[w.tone] || "var(--bench)") + '"></span>'; }).join("") + "</div>";
    h += '<div class="legs">' + m.weights.map(function (w) { return '<div class="leg"><i style="background:' + (TONE[w.tone] || "var(--bench)") + '"></i><span>' + esc(w.label) + '</span><b class="num">' + pc0(w.weight) + "</b></div>"; }).join("") + "</div>";
    if (m.inner) {
      h += '<div class="well" style="display:flex;flex-direction:column;gap:10px;padding:12px"><span class="muted">加密腿内部（腿内口径）</span><div class="inner">';
      h += '<div><span class="sub">BTC</span><b class="num">' + pc2(m.inner.btc) + '</b></div><div><span class="sub">ETH</span><b class="num">' + pc2(m.inner.eth) + '</b></div><div><span class="sub">腿内现金</span><b class="num">' + pc2(m.inner.cash) + "</b></div></div>";
      h += '<span class="sub" style="font-size:12px">折合全组合 BTC 约 <span class="num" style="color:var(--fg)">' + pc0(m.inner.btc_total) + '</span>、ETH 约 <span class="num" style="color:var(--fg)">' + pc0(m.inner.eth_total) + "</span></span></div>";
    }
    h += '<div class="cells"><div><span class="muted">最近调仓</span><b class="num">' + esc(m.last_rebalance) + "</b></div>";
    if (m.need_rebalance === null || m.need_rebalance === undefined) h += '<div><span class="muted">下次检查</span><b>' + esc(m.next_check) + "</b></div>";
    else h += '<div><span class="muted">本月再平衡</span><b style="color:' + (m.need_rebalance ? "var(--warn)" : "var(--teal-2)") + '">' + (m.need_rebalance ? "需要调仓" : "无需调仓") + "</b></div>";
    h += "</div>";
    if (m.alert) h += '<div class="alert"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#E5C05B" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><line x1="12" y1="8" x2="12" y2="12.5"></line><circle cx="12" cy="16" r="0.6" fill="#E5C05B"></circle></svg><span>' + esc(m.alert) + "</span></div>";
    h += "</section>";

    h += '<section class="card fold"><button class="fold-btn" id="fold-chart" type="button" aria-expanded="' + OPEN.chart + '"><h2>收益率走势</h2><span class="sum num">' + c.name + " · 策略 " + pct(c.rs[endI]) + " · " + esc(m.bench_short) + " " + pct(c.rb[endI]) + '</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9AA5A0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg></button>';
    if (OPEN.chart) {
      var keys = [["1y", "1年"], ["3y", "3年"], ["5y", "5年"], ["10y", "10年"], ["all", "全部"]];
      h += '<div class="fold-body"><div class="ranges" role="group" aria-label="时间周期">' + keys.map(function (kv) { return '<button type="button" data-range="' + kv[0] + '" aria-pressed="' + (RANGE === kv[0]) + '">' + kv[1] + "</button>"; }).join("") + "</div>";
      h += '<div class="legend"><span><i style="background:var(--teal)"></i>策略</span><span><i style="background:var(--bench)"></i>' + esc(m.bench_name) + '</span><span><i class="dash"></i>前向起点</span><span style="margin-left:auto;color:var(--fg-3)">按住图表滑动看详情</span></div>';
      h += '<div class="chart" id="chart">' + chartSVG(c, m) + '<div class="tip" id="tip" hidden></div></div>';
      h += '<div class="note">收益率从所选周期第一天（' + c.D[0] + "）起算，回测已扣成本。虚线左边是回测，右边是 " + esc(fw.start) + " 起的前向记录（实盘前）。" + (c.log ? "两条线差距太大，纵轴用对数刻度，同样高度代表同样的涨跌倍数。" : "") + "</div></div>";
    }
    h += "</section>";

    h += '<section class="card fold"><button class="fold-btn" id="fold-fwd" type="button" aria-expanded="' + OPEN.fwd + '"><h2>' + esc(m.forward_title) + '</h2><span class="chip warn">' + fchip + '</span><span class="sum num">' + fdays + ' / 120 天</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9AA5A0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg></button>';
    if (OPEN.fwd) {
      h += '<div class="fold-body"><div class="prog"><i style="width:' + Math.max(1, Math.min(100, fdays / 120 * 100)) + '%"></i></div>';
      h += '<div class="between num"><span>' + esc(fw.start) + " 开始</span><span>" + esc(fw.verdict_date) + " 裁决</span></div>";
      if (fdays > 0) h += '<div class="sub">前向净值 <span class="num" style="color:var(--fg)">' + Number(fw.nav).toFixed(4) + "</span></div>";
      h += '<div class="sub" style="line-height:1.55">' + esc(m.forward_text) + "</div></div>";
    }
    h += "</section>";

    $("main").innerHTML = h;
    $("foot").innerHTML = (MARKET === "crypto" ? "观察席只出数，不给仓位建议" : "只出数，不给实盘仓位建议") + "<br>云端引擎每天东京时间 18:30 计算 · 当日涨跌按目标配比估算";
    wire(c, m);
  }

  function wire(c, m) {
    var fc = $("fold-chart"), ff = $("fold-fwd");
    fc.onclick = function () { OPEN.chart = !OPEN.chart; render(); };
    ff.onclick = function () { OPEN.fwd = !OPEN.fwd; render(); };
    Array.prototype.forEach.call(document.querySelectorAll("[data-range]"), function (b) {
      b.onclick = function () { RANGE = b.getAttribute("data-range"); try { localStorage.setItem("muse.range", RANGE); } catch (e) {} render(); };
    });
    var svg = $("chart-svg"); if (!svg) return;
    var tip = $("tip"), hx = $("hx"), hs = $("hs"), hb = $("hb"), box = $("chart");
    function show(ev) {
      var r = svg.getBoundingClientRect(); if (!r.width) return;
      var px = (ev.clientX - r.left) / r.width * 326;
      var i = Math.max(0, Math.min(c.k - 1, Math.round(px / c.W * (c.k - 1))));
      var x = c.X(i), sv = c.rs[i], bv = c.rb[i], d = sv - bv;
      hx.setAttribute("x1", x); hx.setAttribute("x2", x); hx.setAttribute("stroke-opacity", "0.35");
      hs.setAttribute("cx", x); hs.setAttribute("cy", c.Y(sv)); hs.setAttribute("r", "4.5");
      hb.setAttribute("cx", x); hb.setAttribute("cy", c.Y(bv)); hb.setAttribute("r", "4.5");
      var phase = c.D[i] >= c.fwdStart ? " · 前向" : " · 回测";
      tip.innerHTML = '<span class="num" style="font-size:11px;color:var(--fg-2)">' + c.D[i] + phase + "</span>" +
        '<div class="r"><span><i style="background:var(--teal)"></i>策略</span><b class="num">' + pct(sv) + "</b></div>" +
        '<div class="r"><span><i style="background:var(--bench)"></i>' + esc(m.bench_name) + '</span><b class="num">' + pct(bv) + "</b></div>" +
        '<div class="r d"><span>' + (d >= 0 ? "领先" : "落后") + '</span><b class="num" style="color:' + (d >= 0 ? "var(--teal-2)" : "var(--warn)") + '">' + (Math.abs(d) >= 1000 ? Math.round(Math.abs(d)) : Math.abs(d).toFixed(1)) + " 个点</b></div>";
      tip.hidden = false;
      var bw = box.clientWidth, left = x / 326 * bw - 75;
      tip.style.left = Math.max(0, Math.min(bw - 150, left)) + "px";
    }
    function hide() { tip.hidden = true; hx.setAttribute("stroke-opacity", "0"); hs.setAttribute("r", "0"); hb.setAttribute("r", "0"); }
    svg.addEventListener("pointermove", show);
    svg.addEventListener("pointerdown", show);
    svg.addEventListener("pointerleave", hide);
    svg.addEventListener("pointercancel", hide);
  }

  function setMarket(mk) { MARKET = mk; try { localStorage.setItem("muse.market", mk); } catch (e) {} render(); }
  $("tab-ashare").onclick = function () { setMarket("ashare"); };
  $("tab-crypto").onclick = function () { setMarket("crypto"); };

  function load() {
    return fetch("data.json?t=" + Date.now(), { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error("http " + r.status);
      return r.json();
    }).then(function (d) {
      try { localStorage.setItem("muse.doc", JSON.stringify(d)); } catch (e) {}
      DOC = d; render(); return d;
    });
  }
  function offline() {
    var cached = null;
    try { cached = JSON.parse(localStorage.getItem("muse.doc") || "null"); } catch (e) {}
    if (cached) {
      DOC = cached; render();
      $("dot").className = "dot warn";
      $("status").textContent = "没有网络，显示上次的数据 · A股 " + cached.data_date_ashare + " · 加密 " + cached.data_date_crypto;
    } else {
      $("main").innerHTML = '<div class="card empty"><b>读不到数据</b><span class="muted">请检查网络后点右上角的刷新再试。</span></div>';
      $("status").textContent = "读不到数据";
    }
  }

  $("refresh").onclick = function () {
    var b = $("refresh"); b.classList.remove("spin"); void b.offsetWidth; b.classList.add("spin");
    var before = DOC && DOC.generated_at;
    load().then(function () {
      toast(before && DOC.generated_at === before ? "已是最新数据" : "已更新到最新数据");
    }).catch(function () { toast("刷新失败，请检查网络"); });
  };

  load().catch(offline);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) load().catch(function () {}); });
})();
</script>
</body>
</html>
