<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>新量化手机版</title>
<style>
:root{--bg:#0E1013;--fg:#EEF1EE;color-scheme:dark}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0E1013}}
:root[data-theme="dark"]{--bg:#0E1013}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:#08090B;color:var(--fg);font-family:Inter,"PingFang SC","Noto Sans SC",-apple-system,sans-serif;font-variant-numeric:tabular-nums}
.stage{display:flex;justify-content:center;align-items:flex-start;gap:28px;padding:24px 16px;flex-wrap:wrap}
.hint{max-width:300px;font-size:13px;color:#A3ADA8;line-height:1.7;padding-top:30px}
.hint b{color:#EEF1EE}
.phone{width:390px;height:844px;border-radius:46px;background:var(--bg);box-shadow:0 0 0 10px #1C1F24,0 30px 80px rgba(0,0,0,.6);overflow:hidden;position:relative;display:flex;flex-direction:column}
@media (max-width:520px){.stage{padding:0}.hint{display:none}.phone{width:100vw;height:100dvh;border-radius:0;box-shadow:none}}
.top{padding:max(14px,env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px;background:rgba(14,16,19,.92);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.06);z-index:3}
.phone .top{padding-top:44px}
@media (max-width:520px){.phone .top{padding-top:max(14px,env(safe-area-inset-top))}}
.logo{width:28px;height:28px;border-radius:8px;background:#6EA8FE;color:#0B1220;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:14px}
.rb{margin-left:auto;display:flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:17px;border:0;background:#EEF1EE;color:#0E1013;font:inherit;font-weight:800;font-size:13px}
.scroll{flex:1;overflow-y:auto;padding:14px 14px 90px;display:flex;flex-direction:column;gap:12px}
.scroll>*{flex-shrink:0}
.card{background:#15181D;border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;position:relative}
.lb{font-size:11.5px;font-weight:800;letter-spacing:.08em;color:#A3ADA8}
.f{font-size:11.5px;color:#7F8A85;line-height:1.5}
.d{font-size:12.5px;color:#A3ADA8;line-height:1.5}
.big{font-size:20px;font-weight:900}
.tabbar{position:absolute;left:0;right:0;bottom:0;display:flex;padding:8px 6px max(18px,env(safe-area-inset-bottom));background:rgba(11,13,16,.95);backdrop-filter:blur(12px);border-top:1px solid rgba(255,255,255,.07);z-index:3}
.phone .tabbar{padding-bottom:26px}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:#7F8A85;font:inherit;font-size:10.5px;font-weight:700;position:relative}
.tb.on{color:#B7D2FF}
.tb i{position:absolute;top:-2px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:#F2545B;color:#fff;font-size:10px;font-style:normal;font-weight:800;display:flex;align-items:center;justify-content:center}
.seg{display:flex;gap:2px;padding:3px;background:#1B1F25;border-radius:10px}
.seg button{flex:1;border:0;background:transparent;color:#A3ADA8;font:inherit;font-size:12.5px;height:30px;border-radius:8px}
.seg button.on{background:#15181D;color:#EEF1EE;font-weight:700}
.off{opacity:.45;filter:saturate(.3)}
.tag{font-size:10px;padding:1px 6px;border-radius:5px;border:1px solid rgba(255,255,255,.14);color:#A3ADA8;font-weight:700;white-space:nowrap}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:13px}
.row:last-child{border-bottom:0}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.5);display:none;z-index:9}
.sheet-bg.on{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#15181D;border-radius:20px 20px 0 0;padding:16px 16px 34px;display:flex;flex-direction:column;gap:12px;border-top:1px solid rgba(255,255,255,.1)}
.grab{width:40px;height:5px;border-radius:3px;background:#3A3F47;margin:0 auto}
.act{display:flex;gap:10px}
.act button{flex:1;height:46px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:#1B1F25;color:#EEF1EE;font:inherit;font-weight:800;font-size:14px}
.act button.pri{background:#EEF1EE;color:#0E1013;border-color:transparent}
.st{display:grid;grid-template-columns:20px 1fr auto;gap:8px;align-items:center;font-size:13px;padding:6px 0}
@keyframes sp{to{transform:rotate(360deg)}}.spin{display:inline-block;animation:sp 1s linear infinite}
@media (prefers-reduced-motion:reduce){.spin,.fl{animation:none}.flip-in{transition:none}}
.flip{perspective:1400px}
.flip-in{display:grid;transition:transform .6s;transform-style:preserve-3d}
.flip-face{grid-area:1/1;min-width:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip-back{transform:rotateY(180deg)}
.flip.on .flip-in{transform:rotateY(180deg)}
.lane{background:#15181D;border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:12px 14px 12px 16px;position:relative;overflow:hidden}
.lane::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.lane::after{content:"";position:absolute;inset:0;background:var(--c);opacity:.04;pointer-events:none}
.stp{display:grid;grid-template-columns:22px 1fr;gap:8px;position:relative}
.stp .rail{position:relative;display:flex;justify-content:center}
.stp .dot{width:10px;height:10px;border-radius:5px;margin-top:4px;border:2px solid var(--c);background:#0E1013;z-index:1}
.stp .ln{position:absolute;top:14px;bottom:-6px;width:2px}
.ln svg{display:block}
@keyframes flowv{to{stroke-dashoffset:-24}}
.fl{animation:flowv 1.6s linear infinite}
.xchip{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;font-size:11px;border:1px dashed;margin:6px 6px 0 0;color:#C7CEC9}
.xchip b{font-size:10.5px}
.banner{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:12px;font-size:12.5px;font-weight:700}
#flowfs{display:none;position:fixed;inset:0;z-index:50;background:#0E1013;flex-direction:column}
#flowfs.on{display:flex}.phone #flowfs{position:absolute;border-radius:inherit}
.fsbar{display:flex;align-items:center;gap:8px;padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top));border-bottom:1px solid rgba(255,255,255,.08)}
.fsbar b{flex:1;font-size:14px}.fsbar button{font:inherit;font-size:12px;padding:5px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:#1B1F25;color:#EEF1EE}
.fsin{flex:1;overflow:auto;padding:8px;-webkit-overflow-scrolling:touch}
.xwrap:not(.on) .xlink{display:none!important}
@keyframes nqflow{to{stroke-dashoffset:-48}}.flow{animation:nqflow 2.4s linear infinite}
</style>
</head>

 const rows=(T.rows||[]).map(r=>{const c=LNC[r.lane]||LNC[r.name]||"#A3ADA8";return `<div class="card" style="border-left:3px solid ${c};border-radius:0 16px 16px 0"><div><b style="color:${c}">${esc(r.name||r.lane)}</b>${r.affects?`<span class="tag" style="margin-left:6px;color:${GOOD};border-color:rgba(110,231,168,.4)">影响仓位</span>`:`<span class="tag" style="margin-left:6px">${r.on?"只出数":"未生效"}</span>`}</div>
 <div class="f">① 数据 · 抓取状态</div>${(r.data||[]).map(x=>`<div style="display:flex;font-size:12px"><span><span style="display:inline-block;width:7px;height:7px;border-radius:4px;background:${SC2[x.status]||"#59606A"};margin-right:6px"></span>${esc(x.name)}</span><span class="f" style="margin-left:auto">${esc(x.date||"")}</span></div>`).join("")}
 <div class="f">② 怎么处理</div><div class="d">${(r.proc||[]).map(esc).join("；")}</div>
 <div class="f">③ 今天的信号</div><div style="font-size:12px">${(r.signal||[]).map(esc).join(" · ")}</div>
 <div style="border-top:1px solid rgba(255,255,255,.07);padding-top:6px"><span class="f">④ 结论</span> <b style="color:${GOOD}">${esc((r.conclusion||[])[0]||"")}</b> <span class="f">${esc((r.conclusion||[]).slice(1).join(" · "))}</span></div></div>`}).join("");
 return tog+flow+`<div style="font-size:15px;font-weight:900;margin-top:4px">二、四栏表</div>`+srcCard()+fin+rows;
}
function openFlow(){const o=$("#flowfs");o.classList.add("on");o.querySelector(".fsin").innerHTML=`<div class="xwrap ${S.xOn?"on":""}" style="width:1020px;transform-origin:0 0">${FLOW_HTML}</div>`;fitFlow()}
function fitFlow(){const o=$("#flowfs"),w=o.querySelector(".xwrap");if(!w)return;const k=S.flowFit===false?1:Math.min(1,(o.clientWidth-16)/1020);w.style.transform=`scale(${k})`;w.parentNode.style.height=(w.scrollHeight*k+20)+"px";w.parentNode.style.width=(1020*k)+"px"}
function closeFlow(){$("#flowfs").classList.remove("on")}
window.addEventListener("resize",()=>{if($("#flowfs").classList.contains("on"))fitFlow()});
/* ---------- 刷新（议题 19：手机 → iCloud 快捷指令 → Mac） ---------- */
function openR(){$("#sb").classList.add("on");sheet()}
function closeR(){$("#sb").classList.remove("on")}
function sheet(){const r=S.req,R=S.remote||{},on=R.mac_seen&&(Date.now()-Date.parse(R.mac_seen))<36e5;
 const steps=[["已发送","快捷指令把请求放进 iCloud「量化App/刷新请求」"],["Mac 已收到","App 发现请求，排队（10 分钟内刷过就跳过）"],["刷新中","行情 → 行业 → 新闻 → 生成"],["完成","已推送到手机页"]];
 const idx=!r?-1:R.request_id===r.id?({received:1,skipped:3,running:2,done:3,fail:3}[R.state]??0):0;
 $("#sheet").innerHTML=`<div class="grab"></div><div style="display:flex;align-items:center"><b style="font-size:17px">刷新数据</b><span class="f" style="margin-left:auto">= 在电脑上点刷新</span></div>
 <div class="banner" style="background:${on?"rgba(110,231,168,.1)":"rgba(232,195,94,.1)"};color:${on?GOOD:WARN}">${on?"●":"◐"} Mac 上次在线 ${R.mac_seen?R.mac_seen.slice(5,16).replace("T"," "):"—"} · 上次完整刷新 ${S.last}</div>
 ${r?steps.map((s,i)=>`<div class="st"><span style="color:${i<idx||idx===3?GOOD:i===idx?WARN:"#4A525B"}">${i<idx||idx===3?"✓":i===idx?'<span class="spin">◌</span>':"○"}</span><span><b>${s[0]}</b><div class="f">${i===3&&R.request_id===r.id&&R.state==="skipped"?esc(R.note||"10 分钟内刚刷过，跳过"):i===3&&R.request_id===r.id&&R.state==="fail"?"Mac 刷新失败："+esc(R.note||""):s[1]}</div></span><span class="f">${i===0?r.t:(R.request_id===r.id&&i<=idx&&R.at?R.at.slice(11,16):"")}</span></div>`).join("")+`<div class="f">请求号 ${r.id} · 每 20 秒查一次 Mac 回执</div>`:`<div class="d">点下面任一按钮，手机会打开快捷指令「新量化刷新」，把请求交给你的 Mac。Mac 刷完会自动推送到这一页。</div>`}
 <div class="act"><button class="pri" onclick="go('full')" ${r&&idx<3?"disabled":""}>完整刷新</button><button onclick="go('news')" ${r&&idx<3?"disabled":""}>只刷新闻</button></div>
 <div class="f">Mac 睡眠或关机时：请求留在 iCloud，开机后自动执行。手机端改不了任何设置，也看不到密钥。第一次用请先按电脑上「设置 → 手机刷新」的说明装好快捷指令。</div>`;}
function poll(){fetch("status.json?t="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{if(!j)return;const was=S.remote&&S.remote.state;S.remote=j;if(j.last_full)S.last=j.last_full;if(S.req&&j.request_id===S.req.id&&j.state==="done"&&was!=="done"){setTimeout(()=>location.reload(),1500)}if($("#sb").classList.contains("on"))sheet();render()}).catch(()=>{})}
function go(kind){const now=new Date(),id=now.toISOString().replace(/[-:T]/g,"").slice(0,14)+Math.random().toString(36).slice(2,5);S.req={id,kind,t:now.toTimeString().slice(0,5)};try{localStorage.setItem("nqm_req",JSON.stringify(S.req))}catch(e){}sheet();
 location.href="shortcuts://run-shortcut?name="+encodeURIComponent("新量化刷新")+"&input=text&text="+encodeURIComponent(kind+"|"+id);}
try{const q=JSON.parse(localStorage.getItem("nqm_req")||"null");if(q&&Date.now()-Date.parse(q.id.slice(0,4)+"-"+q.id.slice(4,6)+"-"+q.id.slice(6,8)+"T"+q.id.slice(8,10)+":"+q.id.slice(10,12)+"Z")<36e5)S.req=q}catch(e){}
if(location.protocol.startsWith("http")){poll();setInterval(poll,20000)}

const TABS=[["flow","资金面",'<path d="M3 17l5-5 4 3 8-8"/><path d="M15 7h5v5"/>'],["ind","行业",'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>']];
if(!["flow","ind"].includes(S.tab))S.tab="flow";if(!S.ind||!["d1","d5","du"].includes(S.ind))S.ind="du";
function render(){
 $("#fresh").textContent=`A股 ${md(D.data_date_ashare)} 收盘 · ${S.remote&&S.req&&S.remote.request_id===S.req.id&&S.remote.state==="done"?"刚刚更新":"上次 "+S.last}`;
 $("#tabs").innerHTML=TABS.map(([k,n,ic])=>`<button class="tb ${S.tab===k?"on":""}" onclick="S.tab='${k}';try{localStorage.setItem('nqm_tab','${k}')}catch(e){};render();document.getElementById('sc').scrollTop=0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${ic}</svg>${n}</button>`).join("");
 try{$("#sc").innerHTML=({flow:()=>{S.mk="flow";return pMarket()},ind:()=>{S.mk="ind";return pMarket()}}[S.tab]||(()=>{S.mk="flow";return pMarket()}))();try{fcInit()}catch(_){}}catch(e){$("#sc").innerHTML=`<div class="card" style="color:${BAD}">${esc(e.message)}</div>`}
}
render();
</script>
